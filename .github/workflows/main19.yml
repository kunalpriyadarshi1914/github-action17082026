# Terraform-infra19082026

name: terraform19082026
on: [push]

permissions:
  id-token: write
  contents: read
  ############################terraform-plan##################################################
jobs:
  terraform-plan:
    runs-on:  ubuntu-latest
    steps:
    #############checkout-repository############################
      - name: Checkout
        uses: actions/checkout@v4
    ####### azure-login ######################
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show
     ################ terraform-setup##############
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
    ################# terraform-init###############
      - name: Terraform Init
        run: terraform init
        working-directory: ./parent_modules/dev
    ################# terraform-plan##############
        
      - name: Terraform Plan
        run: terraform plan
        working-directory: ./parent_modules/dev
      
